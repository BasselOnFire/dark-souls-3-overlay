<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS3 Overlay Control</title><link rel="stylesheet" href="style.css"></head>
<body class="control-page"><main class="control"><h1>Dark Souls III — Co-op Overlay</h1><section class="panel"><h2>Spielzeit</h2><div class="control-timer" id="controlTimer">000:00:00</div><div class="buttons"><button id="startTimer">Start</button><button id="pauseTimer">Pause</button><button id="resetTimer" class="danger">Reset</button></div></section><section class="panel"><div class="panel-title"><h2>Spieler & Tode</h2><button id="addPlayer">+ Spieler</button></div><div id="playerControls"></div></section><p class="hint">Tipp: Öffne Overlay und Control auf derselben Domain. Änderungen werden sofort zwischen Browser-Tabs und OBS-Browserquellen synchronisiert.</p></main><script src="app.js"></script></body></html>
