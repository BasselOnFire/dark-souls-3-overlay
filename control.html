<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS3 Overlay Control</title><link rel="stylesheet" href="style.css"></head><body class="control-page"><main class="control"><h1>Dark Souls III — Co-op Overlay</h1><section class="panel"><h2>Spielzeit</h2><div class="control-timer" id="controlTimer">000:00:00</div><div class="time-editor"><label>Stunden<input id="hours" type="number" min="0" value="0"></label><label>Minuten<input id="minutes" type="number" min="0" max="59" value="0"></label><label>Sekunden<input id="seconds" type="number" min="0" max="59" value="0"></label><button id="setTime">Zeit übernehmen</button></div><div class="buttons"><button id="startTimer">▶ Start / Fortsetzen</button><button id="pauseTimer">⏸ Pause</button><button id="resetTimer" class="danger">↺ Reset</button></div></section><section class="panel"><div class="panel-title"><h2>Spieler & Tode</h2><button id="addPlayer">+ Spieler hinzufügen</button></div><div id="playerControls"></div><div class="save-row"><button id="saveAll" class="primary">✓ Alles speichern</button><span id="savedMsg"></span></div></section><p class="hint">Namen und Todeszahlen können direkt eingetragen werden. Danach „Alles speichern“ drücken.</p></main><script src="app.js"></script></body></html>
