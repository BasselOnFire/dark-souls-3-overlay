<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS3 Control Live</title><link rel="stylesheet" href="style.css?v=5"></head><body class="control-page"><main class="control"><h1>Dark Souls III — Co-op Overlay</h1><p id="status">Firebase verbindet…</p><section class="panel"><h2>Spielzeit</h2><div id="controlTimer" class="control-timer">000:00:00</div><div class="time-editor"><label>Stunden<input id="hours" type="number" min="0"></label><label>Minuten<input id="minutes" type="number" min="0" max="59"></label><label>Sekunden<input id="seconds" type="number" min="0" max="59"></label><button id="setTime">Zeit setzen</button></div><div class="buttons"><button id="startTimer">▶ Start</button><button id="pauseTimer">⏸ Pause</button><button id="resetTimer">↺ Reset</button></div></section><section class="panel"><div class="panel-title"><h2>Spieler & Tode</h2><button id="addPlayer">+ Spieler</button></div><div id="playerControls"></div></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="app.js?v=5"></script></body></html>
